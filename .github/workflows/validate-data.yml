name: Validate data

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate event and sagra domain rules
        run: |
          python -m pip install jsonschema
          python update_events.py
          python update_sagre.py
          python validate_data.py
